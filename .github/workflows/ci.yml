name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -r frontend/requirements.txt
      - name: Production install has no torch
        # Hugging Face embeddings are local-only; torch would not fit Render's 512 MB.
        run: >-
          python -c "import importlib.util as u, sys;
          bad = [m for m in ('torch', 'sentence_transformers') if u.find_spec(m)];
          sys.exit(f'unexpected local-only packages: {bad}' if bad else 0)"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests (coverage must be >= 80%)
        # Database tests run against the Neon test branch when this secret exists,
        # each run in its own throwaway schema; otherwise they are skipped.
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: pytest -rs
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt -r requirements-dev.txt -r frontend/requirements.txt
