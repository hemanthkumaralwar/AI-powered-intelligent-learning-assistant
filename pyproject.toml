# Tool configuration only; dependencies are pinned in requirements*.txt (what Render installs).

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "frontend", "tests"]

[tool.ruff.lint]
# PEP 8 (E, W), pyflakes (F), import order (I), naming (N), bugbear (B),
# modern syntax (UP), simplifications (SIM), security checks (S, bandit),
# and cyclomatic complexity (C90).
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Plain `assert` is how pytest tests are written.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["backend", "frontend"]
testpaths = ["tests"]
# importlib mode: tests/ needs no __init__.py files.
addopts = "--import-mode=importlib --cov=app --cov=frontend --cov-report=term-missing"

[tool.coverage.run]
# SQLAlchemy's async engine runs code inside greenlets; without this, lines after a
# database call look unexecuted.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 80
